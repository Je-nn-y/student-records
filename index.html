<!DOCTYPE html>
<html lang="zh-CN" data-theme="navy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>学生记录</title>
<style>
  :root{
    --bg:#F6F9FD; --card:#FFFFFF; --ink:#2E3440; --muted:#7C8694;
    --accent:#2F6DB5; --accent2:#2F6DB5; --line:#DCE4EC;
    --blue:#D8E8FA; --green:#DAF0E6; --yellow:#FBF1D2;
    --blueD:#C2D8F2; --greenD:#C4E6D5; --yellowD:#F2E4B8;
    --x:#D6453E; --mk:#2E8B5E;
  }
  html[data-theme="teal"]{
    --bg:#F3F7F5; --card:#FFFFFF; --ink:#343E3A; --muted:#87958E;
    --accent:#2E8B6F; --accent2:#2E8B6F; --line:#E0EAE4;
  }
  html[data-theme="slate"]{
    --bg:#F5F6F7; --card:#FFFFFF; --ink:#3A3F45; --muted:#8B9099;
    --accent:#5A6470; --accent2:#5A6470; --line:#E6E8EB;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
    padding-bottom:96px;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 14px;
    background:var(--accent);
    color:#fff; box-shadow:0 2px 10px rgba(0,0,0,.08);
  }
  .topbar h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.5px;}
  .theme-ico{
    width:36px; height:36px; border-radius:0; border:none; cursor:pointer;
    background:rgba(255,255,255,.25); color:#fff; font-size:18px; line-height:36px;
  }
  .months{
    display:flex; align-items:center; justify-content:center; gap:18px;
    padding:12px 12px 6px;
    position:sticky; top:102px; z-index:15; background:var(--bg);
  }
  .segbar{
    position:sticky; top:50px; z-index:16; display:flex; gap:8px;
    padding:7px 12px; background:var(--bg); border-bottom:1px solid var(--line);
  }
  .segbar button{
    flex:1; border:1.5px solid var(--line); background:#fff; color:var(--ink);
    border-radius:0; padding:9px; font-size:14px; font-weight:800; cursor:pointer;
  }
  .segbar button.on{ background:var(--accent); color:#fff; border-color:transparent; }
  .marr{
    width:40px; height:40px; border-radius:0; border:none; cursor:pointer;
    background:var(--card); color:var(--accent2); font-size:22px; font-weight:700; line-height:40px;
    box-shadow:0 1px 5px rgba(0,0,0,.06);
  }
  .marr.dis{ color:var(--line); background:var(--bg); box-shadow:none; cursor:default; }
  .mcur{ font-size:16px; font-weight:800; color:var(--ink); min-width:64px; text-align:center; }
  .tbl-wrap{overflow-x:auto; padding:6px 10px 12px; -webkit-overflow-scrolling:touch;}
  table.grid{border-collapse:separate; border-spacing:0; min-width:100%; table-layout:fixed;}
  table.grid th, table.grid td{
    background:var(--card); text-align:center; vertical-align:middle;
    padding:10px 6px; border:none;
  }
  table.grid thead th{
    background:var(--accent); color:#fff;
    font-weight:700; min-width:110px; padding:10px 6px;
  }
  th .ln{font-size:14px; font-weight:800;}
  th .ld{font-size:10px; opacity:.85; font-weight:600; margin-top:1px;}
  th.corner, td.name{
    min-width:64px; max-width:64px; width:64px;
    font-size:13px; color:var(--ink); font-weight:700;
  }
  td.name{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
  tr.band td{
    text-align:left; padding:9px 12px; font-weight:800;
    font-size:14px; color:var(--ink);
  }
  tr.band .tag{padding:3px 12px; border-radius:0;}
  td.cell{
    height:50px; cursor:pointer; transition:transform .05s;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
  }
  td.cell:active{transform:scale(.96);}
  .x{display:block; color:var(--x); font-size:22px; font-weight:900; line-height:1;}
  .mk{display:block; color:var(--mk); font-size:11px; font-weight:800; margin-top:2px;}
  .note{display:block; color:var(--ink); font-size:10px; font-weight:700; margin-top:2px;}
  /* 每个班级不同柔和底色：P2浅蓝 / L2浅绿 / P4浅黄，日期行也随班上色 */
  .grid tbody.band-P2{background:var(--blue);}
  .grid tbody.band-L2{background:var(--green);}
  .grid tbody.band-P4{background:var(--yellow);}
  .grid tbody.band-P2 td.cell, .grid tbody.band-P2 td.name{background:var(--blue);}
  .grid tbody.band-L2 td.cell, .grid tbody.band-L2 td.name{background:var(--green);}
  .grid tbody.band-P4 td.cell, .grid tbody.band-P4 td.name{background:var(--yellow);}
  .grid tbody.band-P2 tr.bandrow td{background:var(--blueD);}
  .grid tbody.band-L2 tr.bandrow td{background:var(--greenD);}
  .grid tbody.band-P4 tr.bandrow td{background:var(--yellowD);}
  .grid tbody td.cell.has{box-shadow:inset 0 0 0 2px rgba(0,0,0,.14);}
  .grid tbody tr.daterow td{ background:transparent; font-size:12px; font-weight:800; color:var(--ink); padding:7px 6px; border-top:2px solid rgba(0,0,0,.16); }
  td.datecell{ cursor:pointer; padding:7px 6px; }
  td.datecell:active{ transform:scale(.97); }
  td.datecell .dd{ font-size:12px; font-weight:800; color:var(--ink); }
  td.datecell .dc{ font-size:10px; font-weight:600; color:var(--muted); line-height:1.35; margin-top:3px; }
  /* 表格正下方：每班一个可编辑进度备注卡片（不进任何格子） */
  .pnote{ margin:14px 10px 4px; border:2px solid var(--line); padding:12px 14px; }
  .pnote-P2{ background:var(--blue); border-color:var(--blueD); }
  .pnote-L2{ background:var(--green); border-color:var(--greenD); }
  .pnote-P4{ background:var(--yellow); border-color:var(--yellowD); }
  .pnote-h{ font-weight:800; font-size:13px; color:var(--ink); margin-bottom:8px; }
  .pnote-area{ width:100%; min-height:66px; border:1.5px solid var(--line); border-radius:0; padding:10px;
    font-size:13px; line-height:1.8; font-family:inherit; color:var(--ink); background:#fff; resize:vertical; }
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:25;
    display:flex; gap:12px; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
    background:rgba(246,249,253,.78);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    border-top:1px solid rgba(220,228,236,.7);
  }
  .bottombar button{
    flex:1; border:1px solid rgba(47,109,181,.28); border-radius:16px; padding:13px 10px;
    font-size:15px; font-weight:600; color:var(--accent); cursor:pointer;
    background:rgba(255,255,255,.72);
    display:flex; align-items:center; justify-content:center; gap:7px;
    -webkit-tap-highlight-color:transparent;
    transition:transform .12s ease, background .18s ease;
    box-shadow:0 2px 8px rgba(47,109,181,.06);
  }
  .bottombar button:active{transform:scale(.97); background:rgba(255,255,255,.96);}
  .bottombar button svg{width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
  .modal-mask{
    position:fixed; inset:0; z-index:70; background:rgba(40,30,50,.3);
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal-mask.hidden{display:none;}
  .sheet{
    width:100%; max-width:460px; background:var(--card); border-radius:18px 18px 0 0;
    padding:8px 18px calc(20px + env(safe-area-inset-bottom)); animation:up .2s cubic-bezier(.22,.9,.3,1);
    box-shadow:0 -6px 24px rgba(30,40,60,.12);
  }
  .sheet-handle{width:38px; height:4px; border-radius:3px; background:rgba(120,130,145,.35); margin:6px auto 12px;}
  @keyframes up{from{transform:translateY(48px);opacity:.55}to{transform:translateY(0)}}
  .sheet h3{margin:0 0 4px; font-size:17px; font-weight:600; color:var(--ink);}
  .sheet .sub{color:var(--muted); font-size:12px; margin-bottom:12px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px; font-weight:600;}
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--line); border-radius:10px; padding:11px;
    font-size:14px; background:#fff; color:var(--ink); font-family:inherit;
  }
  .rc-btns{display:flex; flex-direction:column; gap:9px; margin-top:6px;}
  .rc-btns button{
    border:none; border-radius:11px; padding:13px; font-size:15px; font-weight:700; cursor:pointer; color:#fff;
  }
  .rc-leave{background:#FF4D6D;}
  .rc-makeup{background:#0EA371;}
  .rc-clear{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .sync-help{margin:4px 0 10px; font-size:12px; color:var(--muted);}
  .sync-help summary{cursor:pointer; font-weight:600; user-select:none;}
  .sync-help-body{margin-top:7px; line-height:1.65; background:var(--bg); padding:9px 11px; border-radius:9px; border:1px solid var(--line);}
  .sync-msg{margin-top:11px; font-size:13px; color:var(--accent); min-height:18px; line-height:1.5;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1.5px solid var(--line); background:#fff; border-radius:11px; padding:9px 13px;
    font-size:13px; cursor:pointer; color:var(--ink); font-weight:600;
    transition:transform .1s ease;
  }
  .chip:active{transform:scale(.96);}
  .chip.on{background:var(--accent); color:#fff; border-color:transparent;}
  .top-actions{display:flex; gap:8px;}
  /* 弹窗头部图标徽标（区分创意 / 课堂） */
  .sheet-head{display:flex; align-items:center; gap:11px; margin-bottom:4px;}
  .sheet-ico{width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; box-shadow:0 3px 9px rgba(30,40,60,.14);}
  .sheet-ico svg{width:20px; height:20px; stroke:#fff; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
  .sheet-ico.idea{background:linear-gradient(135deg,#F7B955,#E58E2B);}
  .sheet-ico.lesson{background:var(--accent);}
  .idea-tag{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px; background:#FFF3E0; color:#C77700;}
  .pc-mod{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:800; color:var(--ink);}
  .pc-mod .emi{font-size:14px; line-height:1;}
  .pcard-h .pc-tag{font-size:11px; font-weight:800; padding:3px 10px; color:var(--muted); background:#F2F4F7; border-radius:999px;}
  .trait-badge{display:inline-block; margin-top:3px; font-size:9px; font-weight:800; color:#C77700; background:#FFF3E0; padding:1px 6px; border-radius:6px;}
  .pcard{border-radius:10px;}
  .stu-card{border-radius:10px;}
  .pc-free{border-left-color:#F2C14E;}
  .free-wrap{padding:4px 10px 6px;}
  .free-hint{font-size:12px; color:var(--muted); margin:2px 2px 8px;}
  .pop-mask{position:fixed; inset:0; z-index:60; background:rgba(40,30,50,.22);}
  .pop-mask.hidden{display:none;}
  .pop{position:fixed; top:58px; right:10px; width:230px; background:var(--card); box-shadow:0 10px 30px rgba(0,0,0,.22); padding:16px;}
  .pop.hidden{display:none;}
  .menu h4{margin:0 0 10px; font-size:13px; color:var(--muted);}
  .menu-row{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-top:1px solid var(--line); cursor:pointer; font-weight:600;}
  .menu-row:active{opacity:.6;}
  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%); z-index:80;
    background:rgba(40,30,50,.9); color:#fff; padding:10px 18px; border-radius:0; font-size:13px;
    opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show{opacity:1;}
  .hidden{display:none!important;}
  /* 个人情况：三模块子标签 + 记录列表（record-first，只显示写过的） */
  .person-root{ padding:0; }
  .psearch{ padding:8px 10px 4px; }
  .psearch input{ width:100%; border:1.5px solid var(--line); border-radius:0; padding:11px 12px; font-size:14px; background:#fff; color:var(--ink); font-family:inherit; }
  .subseg{
    display:flex; gap:8px; padding:7px 12px; background:var(--bg);
  }
  .subseg-btn{
    flex:1; border:1.5px solid var(--line); background:#fff; color:var(--ink);
    border-radius:0; padding:9px; font-size:14px; font-weight:800; cursor:pointer;
  }
  .subseg-btn.on{ background:var(--accent); color:#fff; border-color:transparent; }
  .person-wrap{ padding:8px 10px 14px; }
  .pcard{ background:#fff; border:1px solid var(--line); border-left:4px solid var(--accent); margin-bottom:11px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  .pcard.pc-P2{ border-left-color:var(--blueD); }
  .pcard.pc-L2{ border-left-color:var(--greenD); }
  .pcard.pc-P4{ border-left-color:var(--yellowD); }
  .pcard-h{ display:flex; align-items:center; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--line); }
  .pc-name{ font-weight:800; font-size:15px; color:var(--ink); }
  .pc-tag{ font-size:11px; font-weight:800; padding:3px 10px; color:var(--muted); background:#F2F4F7; }
  .pcard-body{ padding:11px 12px; font-size:13px; line-height:1.6; color:var(--ink); white-space:pre-wrap; word-break:break-word; cursor:pointer; }
  .pcard-body:active{ background:#F5F8FC; }
  .pempty{ padding:30px 16px; text-align:center; color:var(--muted); font-size:13px; line-height:1.7; }
  .padd{
    width:100%; margin-top:4px; border:1.5px dashed var(--line); background:#fff; color:var(--accent);
    border-radius:0; padding:13px; font-size:14px; font-weight:800; cursor:pointer;
  }
  .padd:active{ background:#F5F8FC; }
  /* 个人情况：学生列表（进详情前的选择页） */
  .stu-list{ padding:8px 10px 14px; }
  .stu-class-h{ display:flex; align-items:center; gap:8px; margin:14px 2px 9px; font-weight:800; font-size:14px; color:var(--ink); }
  .cn-dot{ width:10px; height:10px; border-radius:0; flex:0 0 auto; }
  .cn-dot.cn-P2{ background:var(--blueD); }
  .cn-dot.cn-L2{ background:var(--greenD); }
  .cn-dot.cn-P4{ background:var(--yellowD); }
  .stu-card{ display:flex; align-items:center; gap:10px; background:#fff; border:1px solid var(--line); border-left:4px solid var(--accent); margin-bottom:10px; padding:13px 12px; box-shadow:0 1px 4px rgba(0,0,0,.05); cursor:pointer; }
  .stu-card.pc-P2{ border-left-color:var(--blueD); }
  .stu-card.pc-L2{ border-left-color:var(--greenD); }
  .stu-card.pc-P4{ border-left-color:var(--yellowD); }
  .stu-card:active{ background:#F5F8FC; }
  .stu-name{ font-weight:800; font-size:16px; color:var(--ink); }
  .stu-counts{ flex:1; font-size:12px; color:var(--muted); }
  .stu-go{ font-size:20px; font-weight:800; color:var(--muted); }
  /* 个人情况：单个学生详情页（只显示该学生，不含其他人） */
  .pdetail-top{ position:sticky; top:104px; z-index:15; background:var(--bg); border-bottom:1px solid var(--line); }
  .pdetail-h{ display:flex; align-items:center; gap:10px; padding:10px 12px; }
  .pback{ border:1.5px solid var(--line); background:#fff; color:var(--ink); border-radius:0; padding:7px 13px; font-size:14px; font-weight:800; cursor:pointer; }
  .pdetail-name{ font-weight:800; font-size:17px; color:var(--ink); }
  .field textarea#imp-text{ font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; line-height:1.6; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>学生记录</h1>
    <div class="top-actions">
      <button class="theme-ico" data-action="open-theme" title="换颜色（点一下切换）">◐</button>
      <button class="theme-ico" data-action="open-settings" title="设置">⚙</button>
    </div>
  </div>
  <div class="segbar" id="views">
    <button data-action="switch-view" data-view="attend" class="on">出勤表</button>
    <button data-action="switch-view" data-view="person">个人情况</button>
  </div>
  <div class="months" id="months"></div>
  <div class="tbl-wrap" id="tbl"></div>
  <div id="ptbl" class="person-root" style="display:none"></div>

  <div class="bottombar">
    <button data-action="open-quick">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      写一笔
    </button>
    <button data-action="open-lesson">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>
      记一堂课
    </button>
  </div>

  <div class="modal-mask hidden" id="modal"><div class="sheet" id="sheet"></div></div>
  <div class="pop-mask hidden" id="popMask">
    <div class="pop hidden" id="menu"></div>
  </div>
  <div class="toast" id="toast"></div>

  function parseImport(text){
    if(!text||!String(text).trim()){ toast("先粘贴文字或选文件"); return; }
    var d;
    try{ d=JSON.parse(text); }catch(e){ toast("文字不是合法 JSON，检查引号/括号"); return; }
    if(!d||typeof d!=="object"){ toast("内容格式不对"); return; }
    if(Array.isArray(d.students) && d.students.length){
      state.students=d.students.map(function(s,i){return {id:s.id||("s"+i+Math.random().toString(36).slice(2,6)), name:s.name||(typeof s==="string"?s:""), classId:s.classId||""};});
    }
    if(Array.isArray(d.classes) && d.classes.length){
      state.classes=d.classes.map(function(c){return {id:c.id,name:c.name||""};});
    }
    if(Array.isArray(d.records)){
      state.records=d.records.filter(function(r){return r&&r.studentId!=null&&r.lesson!=null;}).map(function(r){return {studentId:r.studentId,lesson:Number(r.lesson),leave:r.leave!==false,makeupDate:r.makeupDate||null,note:r.note||null};});
    } else if(Array.isArray(d.entries)){
      var recs=[];
      d.entries.forEach(function(e){
        if((e.type==="请假"||e.type==="补课")&&e.studentId&&e.lesson!=null&&e.lesson!==""){
          var mk=null;
          if(e.type==="补课") mk=e.date||e.makeUpDate||null;
          else if(e.status==="已补"&&e.makeUpDate) mk=e.makeUpDate;
          recs.push({studentId:e.studentId,lesson:Number(e.lesson),leave:true,makeupDate:mk,note:e.note||null});
        }
      });
      state.records=recs;
    }
    // 个人情况三模块：优先用新格式 d.person（只覆盖文件中出现的模块）
    if(d.person && typeof d.person==="object"){
      ["lesson","parent","checkin"].forEach(function(mod){
        if(Array.isArray(d.person[mod])){
          state.settings.person[mod]=d.person[mod].map(function(r){
            return {id:r.id||genId(), stuId:r.stuId, lesson:r.lesson!=null?Number(r.lesson):undefined, date:r.date||null, text:r.text||r.content||r.note||"", idea:!!r.idea};
          });
        }
      });
    }
    // 记一堂课：班级共同特点（班级级，独立存储）
    if(Array.isArray(d.classTraits)){
      state.settings.classTraits=d.classTraits.map(function(t){
        return {id:t.id||genId(), classId:t.classId, lesson:t.lesson!=null?Number(t.lesson):undefined, date:t.date||null, students:Array.isArray(t.students)?t.students:[], text:t.text||t.content||t.note||""};
      });
    }
    // 兼容旧格式：classNotes / settings.classNotes / entries(type=上课) → 上课模块
    var legacyLesson=[];
    function addLegacy(stuId,les,date,text){
      if(!stuId||les==null||les==="") return;
      if(text!=null&&String(text).trim()) legacyLesson.push({id:genId(), stuId:stuId, lesson:Number(les), date:date||null, text:String(text).trim()});
    }
    if(d.classNotes&&typeof d.classNotes==="object"){ Object.keys(d.classNotes).forEach(function(k){ var p=k.split("|"); addLegacy(p[0],p[1],null,d.classNotes[k]); }); }
    if(d.settings&&d.settings.classNotes&&typeof d.settings.classNotes==="object"){ Object.keys(d.settings.classNotes).forEach(function(k){ var p=k.split("|"); addLegacy(p[0],p[1],null,d.settings.classNotes[k]); }); }
    if(Array.isArray(d.entries)){
      d.entries.forEach(function(e){
        if(e.type==="上课"&&e.studentId){ addLegacy(e.studentId, e.lesson, e.date||null, e.note||e.content||e.text||e.detail||e.remark||e.desc||""); }
      });
    }
    if(legacyLesson.length) state.settings.person.lesson=(state.settings.person.lesson||[]).concat(legacyLesson);
    // 顺手把其它用户数据也吸收（避免导出再导入丢内容）
    if(d.settings){
      if(d.settings.lessonNotes&&typeof d.settings.lessonNotes==="object") state.settings.lessonNotes=d.settings.lessonNotes;
      if(d.settings.progressNotes&&typeof d.settings.progressNotes==="object") state.settings.progressNotes=d.settings.progressNotes;
      if(d.settings.theme) state.settings.theme=d.settings.theme;
    }
    if(d.lessonNotes&&typeof d.lessonNotes==="object") state.settings.lessonNotes=d.lessonNotes;
    if(d.progressNotes&&typeof d.progressNotes==="object") state.settings.progressNotes=d.progressNotes;
    save(); render(); closeModal(); closePop();
    toast("导入成功（上课/家长/打卡已保留）");
  }

  // ===== 同步（GitHub 私人 Gist，按同步码隔离，数据只在用户自己的 GitHub 里）=====
  function readSyncCfg(){ try{ return JSON.parse(localStorage.getItem("sr_sync_cfg"))||{}; }catch(e){ return {}; } }
  function saveSyncCfg(o){ var c=readSyncCfg(); for(var k in o){ if(o.hasOwnProperty(k)) c[k]=o[k]; } localStorage.setItem("sr_sync_cfg",JSON.stringify(c)); }
  function githubApi(method,url,token,body){
    return fetch(url,{method:method,headers:{"Authorization":"token "+token,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined})
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); var ct=r.headers.get("content-type")||""; return ct.indexOf("application/json")>=0?r.json():r.text(); });
  }
  function openSync(){
    closePop();
    var cfg=readSyncCfg();
    var html='<h3>同步</h3>'+
      '<div class="sub">填下面这一个「同步码」（其实就是你的 GitHub 钥匙）。上传，就把数据存到你自己的私人云端；换手机 / 电脑，打开这里填同一个码、点「下载」就取回来。数据只存在你自己的 GitHub 里。下载会用云端版本覆盖当前手机数据。</div>'+
      '<div class="field"><label>同步码（你的 GitHub 钥匙，只填这一次，自动记住）</label><input id="sync-token" type="password" value="'+esc(cfg.token||"")+'" placeholder="粘贴你的 GitHub token（gist 权限）"></div>'+
      '<details class="sync-help"><summary>怎么拿这个码（GitHub 钥匙）？</summary>'+
      '<div class="sync-help-body">打开 github.com → 右上角头像 → Settings → 最下面 Developer settings → Personal access tokens → Tokens (classic) → Generate new token → 只勾 <b>gist</b> → 生成后复制那一长串粘进来。钥匙只存在你手机，不会外传。换设备时，把这一长串再粘一次就行。</div></details>'+
      '<div class="rc-btns">'+
        '<button class="rc-makeup" data-act="sync-up">上传（存到云端）</button>'+
        '<button class="rc-leave" data-act="sync-down">下载（取回数据）</button>'+
        '<button class="rc-clear" data-act="close-modal">取消</button>'+
      '</div>'+
      '<div id="sync-msg" class="sync-msg"></div>';
    openModal(html);
  }
  function syncMsg(t){ var m=document.getElementById("sync-msg"); if(m) m.textContent=t; }
  function syncDataPayload(){
    return JSON.stringify({
      students:state.students, classes:state.classes, records:state.records,
      person:state.settings.person||{lesson:[],parent:[],checkin:[]},
      lessonNotes:state.settings.lessonNotes||{}, classTraits:state.settings.classTraits||[],
      progressNotes:state.settings.progressNotes||{}, theme:state.settings.theme||"navy"
    },null,2);
  }
  function searchAndWrite(token,payload){
    return githubApi("GET","https://api.github.com/gists",token).then(function(list){
      var found=(list||[]).find(function(g){return g.description==="sr-sync";});
      if(found) return githubApi("PATCH","https://api.github.com/gists/"+found.id,token,{files:{"sr-data.json":{content:payload}}}).then(function(res){ saveSyncCfg({gistId:found.id}); return res; });
      return githubApi("POST","https://api.github.com/gists",token,{description:"sr-sync",public:false,files:{"sr-data.json":{content:payload}}}).then(function(res){ if(res&&res.id) saveSyncCfg({gistId:res.id}); return res; });
    });
  }
  function uploadSync(){
    var token=document.getElementById("sync-token").value.trim();
    if(!token){ syncMsg("先填同步码（GitHub 钥匙）"); return; }
    var cfg=readSyncCfg(); cfg.token=token; saveSyncCfg(cfg);
    var payload=syncDataPayload();
    syncMsg("上传中…");
    var job = cfg.gistId
      ? githubApi("PATCH","https://api.github.com/gists/"+cfg.gistId,token,{files:{"sr-data.json":{content:payload}}})
          .then(function(res){ if(res&&res.id) saveSyncCfg({gistId:res.id}); return res; })
          .catch(function(){ return searchAndWrite(token,payload); })
      : searchAndWrite(token,payload);
    job.then(function(){ syncMsg("已上传到你的私人云端 ✦"); toast("已同步上传"); closeModal(); })
       .catch(function(e){ syncMsg("上传失败："+(e.message||e)+"（检查钥匙是否填对、有没有勾 gist 权限）"); });
  }
  function downloadSync(){
    var token=document.getElementById("sync-token").value.trim();
    if(!token){ syncMsg("先填同步码（GitHub 钥匙）"); return; }
    var cfg=readSyncCfg(); cfg.token=token; saveSyncCfg(cfg);
    syncMsg("下载中…");
    function read(id){
      return githubApi("GET","https://api.github.com/gists/"+id,token).then(function(g){
        var fn=Object.keys(g.files||{}).find(function(f){return f==="sr-data.json";});
        if(!fn){ syncMsg("云端没有数据"); return; }
        saveSyncCfg({gistId:id}); syncMsg("已取回，正在载入…"); parseImport(g.files[fn].content);
      });
    }
    function searchAndRead(){
      return githubApi("GET","https://api.github.com/gists",token).then(function(list){
        var found=(list||[]).find(function(g){return g.description==="sr-sync";});
        if(!found){ syncMsg("还没上传过数据，先点「上传」存一份"); return; }
        return read(found.id);
      });
    }
    var job = cfg.gistId
      ? read(cfg.gistId).catch(function(){ return searchAndRead(); })
      : searchAndRead();
    job.catch(function(e){ syncMsg("下载失败："+(e.message||e)); });
  }

  document.addEventListener("click",function(ev){
    var el=ev.target.closest("[data-action],[data-act],[data-theme],[data-pick],[data-less],[data-lp],[data-ll],[data-ls],[data-m]");
    if(!el) return;
    if(el.dataset.action){
      var a=el.dataset.action;
      if(a==="open-theme"){ cycleTheme(); }
      else if(a==="open-settings"){ openSettings(); }
      else if(a==="switch-view"){ state.view=el.dataset.view; render(); }
      else if(a==="switch-month"){ if(!el.dataset.m) return; state.activeMonth=el.dataset.m; render(); }
      else if(a==="cell"){ openCell(el.dataset.stu, el.dataset.lesson); }
      else if(a==="date"){ openDate(el.dataset.cid, el.dataset.lesson); }
      else if(a==="switch-sub"){ state.subtab=el.dataset.sub; render(); }
      else if(a==="open-quick"){ openQuick(); }
      else if(a==="open-lesson"){ openLessonCapture(); }
      else if(a==="penter"){ state.pstu=el.dataset.stu; render(); }
      else if(a==="pback"){ state.pstu=null; render(); }
      else if(a==="padd"){ openPersonEdit(el.dataset.mod, null, el.dataset.stu); }
      else if(a==="pedit"){ openPersonEdit(el.dataset.mod, el.dataset.id); }
      else if(a==="pedit-trait"){ var tr=findTraitById(el.dataset.id); if(tr) openDate(tr.classId, tr.lesson); }
      return;
    }
    if(el.dataset.act){
      var act=el.dataset.act;
      if(act==="rc-leave"){ var ce=curCell(); var nt=document.getElementById("rc-note")?document.getElementById("rc-note").value:""; if(ce) upsertRec(ce.stu,ce.lesson,true,null,nt); closeModal(); }
      else if(act==="rc-makeup"){ var ce2=curCell(); var dt=document.getElementById("rc-date").value||today(); var nt2=document.getElementById("rc-note")?document.getElementById("rc-note").value:""; if(ce2) upsertRec(ce2.stu,ce2.lesson,true,dt,nt2); closeModal(); }
      else if(act==="rc-clear"){ var ce3=curCell(); if(ce3) upsertRec(ce3.stu,ce3.lesson,false,null,null); closeModal(); }
      else if(act==="dt-save"){
        if(_curDate){
          var dta=document.getElementById("dt-content");
          var dk=(className(_curDate.cid)||"").toLowerCase()+"|"+_curDate.lesson;
          if(!state.settings.lessonNotes) state.settings.lessonNotes={};
          state.settings.lessonNotes[dk]=dta?dta.value.trim():"";
          var tt=document.getElementById("dt-trait"); var tv=tt?tt.value.trim():"";
          var tsChips=document.querySelectorAll("#dt-students .chip.on");
          var ts=Array.prototype.map.call(tsChips,function(c){return c.dataset.ls;});
          if(!state.settings.classTraits) state.settings.classTraits=[];
          var ex=findTrait(_curDate.cid,_curDate.lesson);
          if(tv){ if(ex){ ex.text=tv; ex.students=ts; } else { var tl=lesById(_curDate.cid,_curDate.lesson); state.settings.classTraits.push({id:genId(), classId:_curDate.cid, lesson:_curDate.lesson, date:tl?tl.date:null, students:ts, text:tv}); } }
          else if(ex){ state.settings.classTraits=state.settings.classTraits.filter(function(t){return t!==ex;}); }
          save(); render(); closeModal();
        }
      }
      else if(act==="dt-clear"){ if(_curDate){ var dk2=(className(_curDate.cid)||"").toLowerCase()+"|"+_curDate.lesson; if(state.settings.lessonNotes) delete state.settings.lessonNotes[dk2]; if(state.settings.classTraits) state.settings.classTraits=state.settings.classTraits.filter(function(t){return !(t.classId===_curDate.cid && Number(t.lesson)===Number(_curDate.lesson));}); save(); render(); closeModal(); } }
      else if(act==="p-save"){
        var pmod=el.dataset.mod, pid=el.dataset.id;
        var pstu=document.getElementById("p-stu").value;
        var ptext=document.getElementById("p-text").value.trim();
        var arr=state.settings.person[pmod]; if(!arr) arr=state.settings.person[pmod]=[];
        var rec; if(pid){ rec=arr.find(function(r){return r.id===pid;}); if(!rec){ rec={id:pid}; arr.push(rec); } } else { rec={id:genId()}; arr.push(rec); }
        rec.stuId=pstu?pstu:null; rec.text=ptext;
        if(pmod==="lesson"){
          var plesv=document.getElementById("p-les").value;
          if(plesv){ var ples=Number(plesv); var pst=stuById(pstu), pcid=pst?pst.classId:null, pl=lesById(pcid,ples); rec.lesson=ples; rec.date=pl?pl.date:null; }
        } else {
          rec.date=document.getElementById("p-date").value||today();
        }
        save(); state.view="person"; state.subtab=pmod; render(); closeModal(); toast("已保存");
      }
      else if(act==="p-del"){
        var dmod=el.dataset.mod, did=el.dataset.id;
        state.settings.person[dmod]=state.settings.person[dmod].filter(function(r){return r.id!==did;});
        save(); render(); closeModal(); toast("已删除");
      }
      else if(act==="lc-save"){
        var lp=document.querySelector("#lc-pick .chip.on"), ll=document.querySelector("#lc-less .chip.on");
        if(!lp){ toast("先选班级"); return; }
        if(!ll){ toast("先选第几节"); return; }
        var stuChips=document.querySelectorAll("#lc-students .chip.on");
        if(!stuChips.length){ toast("至少勾选一个在场的小朋友"); return; }
        var cid=lp.dataset.lp, lles=Number(ll.dataset.ll);
        var txt=document.getElementById("lc-text").value.trim();
        if(!txt){ toast("写点这堂课的共同特点"); return; }
        var stus=Array.prototype.map.call(stuChips,function(c){return c.dataset.ls;});
        var l=lesById(cid,lles);
        if(!state.settings.classTraits) state.settings.classTraits=[];
        var ex=findTrait(cid,lles);
        if(ex){ ex.text=txt; ex.students=stus; ex.date=l?l.date:null; }
        else { state.settings.classTraits.push({id:genId(), classId:cid, lesson:lles, date:l?l.date:null, students:stus, text:txt}); }
        save(); state.view="attend"; render(); closeModal(); toast("已记录这堂课的共同特点");
      }
      else if(act==="imp-file"){ var fi=document.createElement("input"); fi.type="file"; fi.accept=".json,application/json"; fi.onchange=function(){ if(fi.files[0]) importFromFile(fi.files[0]); }; fi.click(); }
      else if(act==="imp-go"){ var it=document.getElementById("imp-text"); parseImport(it?it.value:""); }
      else if(act==="qk-save"){
        var ps=document.querySelector("#qk-pick .chip.on");
        var pl=document.querySelector("#qk-less .chip.on");
        var qles=pl?Number(pl.dataset.less):null;
        var qtxt=document.getElementById("qk-text").value.trim();
        if(!ps && qles==null && !qtxt){ toast("写点什么，或选个学生 / 节次"); return; }
        var stuId=ps?ps.dataset.pick:null;
        var qst=ps?stuById(stuId):null, qcid=qst?qst.classId:null, ql=qles!=null?lesById(qcid,qles):null;
        state.settings.person.lesson.push({id:genId(), stuId:stuId, lesson:qles, date:ql?ql.date:null, text:qtxt, idea:true});
        save(); state.view="person"; state.subtab="lesson"; state.pstu=stuId; render(); closeModal(); toast("已记下想法 ✦");
      }
      else if(act==="set-import"){ openImport(); }
      else if(act==="sync-up"){ uploadSync(); }
      else if(act==="sync-down"){ downloadSync(); }
      else if(act==="set-export"){ doExport(); }
      else if(act==="set-recycle"){ toast("回收站（后续做）"); }
      else if(act==="set-sync"){ openSync(); }
      else if(act==="set-close"){ closePop(); }
      else if(act==="close-modal"){ closeModal(); }
      return;
    }
    if(el.dataset.theme){ state.settings.theme=el.dataset.theme; save(); render(); closePop(); return; }
    if(el.dataset.pick){ toggleChip(el,false); return; }
    if(el.dataset.less){ toggleChip(el,false); return; }
    if(el.dataset.lp){ toggleChip(el,false); var sel=document.querySelector("#lc-pick .chip.on"); renderLessonStudents(sel?sel.dataset.lp:null); return; }
    if(el.dataset.ll){ toggleChip(el,false); return; }
    if(el.dataset.ls){ toggleChip(el,true); return; }
  });
  document.getElementById("modal").addEventListener("click",function(e){ if(e.target===this) closeModal(); });
  document.getElementById("popMask").addEventListener("click",function(e){ if(e.target===this) closePop(); });
  // 进度备注卡片：边写边自动保存（不重渲染，保留输入焦点）
  document.getElementById("tbl").addEventListener("input",function(e){
    var ta=e.target.closest(".pnote-area");
    if(ta){ var k=ta.dataset.pn; if(!state.settings.progressNotes) state.settings.progressNotes={}; state.settings.progressNotes[k]=ta.value; save(); }
  });
  // 个人情况：学生搜索（只更新列表，保留搜索框焦点）
  document.getElementById("ptbl").addEventListener("input",function(e){
    var s=e.target.closest("#psearch");
    if(s){ state.search=s.value; var box=document.getElementById("stulist"); if(box) box.innerHTML=buildStuCards(); }
  });

  function curCell(){ if(!_cur) return null; return _cur; }

    load();
    if(!state.students.length) seedDefault();
    migrateSettings();
    seedPersonDemo();
    render();
})();
</script>
</body>
</html>
